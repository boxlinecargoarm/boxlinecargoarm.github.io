<!DOCTYPE html>

<style>
body{
    margin:0;
    padding:0;
    background:#0C2A52;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
}

.wrapper{
    max-width:900px;
    margin:0 auto;
    padding:40px 15px;
}

h1{
    font-weight:800;
    letter-spacing:1px;
    font-size:clamp(28px,6vw,48px);

h2{

.logo-wrapper{

    justify-content:center;
    align-items:center;
    background:white;
    margin:40px auto;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

.logo-wrapper img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.divider{
    width:80%;
    height:1px;
    background:white;
    margin:25px auto;
    opacity:0.4;
}

.info{
    font-size:clamp(12px,3vw,14px);
    line-height:1.6;
    letter-spacing:0.6px;
}

.social{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.social img{
    width:clamp(40px,12vw,60px);
    transition:0.2s;
}

.social img:hover{
    transform:scale(1.1);
}

@media (max-width:400px){
    .social{
        gap:12px;
    }
}
</style>
</head>
